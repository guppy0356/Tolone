# Every commit must typecheck (tsc for each playground with staged changes) and keep the
# playground requirement files in the shape of
# docs/architecture/workflow.md § Requirements, plans, and runs (ADR 0014).
pre-commit:
  commands:
    check-readme:
      # README append-only, [x] ↔ same-named test, check-offs follow the committed plan,
      # plan.md shape. Reads `git diff --cached` itself; exits 0 when no playground
      # README / plan / test is staged.
      run: node scripts/check-playground-readme.mjs
    typecheck:
      run: |
        dirs=$(git diff --cached --name-only --diff-filter=d | grep '^playgrounds/' | cut -d/ -f1-2 | sort -u) || true
        for dir in $dirs; do
          [ -d "$dir" ] || continue
          pnpm --filter "@tolone/$(basename "$dir")" exec tsc --noEmit -p . || exit 1
        done
