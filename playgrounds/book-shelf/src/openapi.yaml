openapi: 3.1.0
info:
  title: Book-shelf
  version: 0.0.0
paths:
  /api/books:
    post:
      summary: Register a book from its ISBN-13
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookInput"
      responses:
        "201":
          description: The registered book, resolved from the ISBN-13
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
components:
  schemas:
    Book:
      type: object
      required: [id, isbn13, title, coverUrl, authors, publisher, registeredAt]
      properties:
        id:
          type: string
        isbn13:
          type: string
        title:
          type: string
        coverUrl:
          type: string
          format: uri
        authors:
          type: array
          items:
            type: string
        publisher:
          type: string
        registeredAt:
          type: string
          format: date-time
    CreateBookInput:
      type: object
      required: [isbn13]
      properties:
        isbn13:
          type: string
