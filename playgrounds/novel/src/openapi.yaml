openapi: 3.1.0
info:
  title: Novel API
  version: 0.1.0

paths:
  /api/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

  /api/books:
    get:
      operationId: getBooks
      responses:
        "200":
          description: List of books for the sidebar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookSummary"

  /api/books/{id}:
    get:
      operationId: getBook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Authenticated reader view of the book (metadata + bookmark)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /api/preview-books/{id}:
    get:
      operationId: getBookPreview
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public preview of the book (metadata + first N pages)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookPreview"
        "404":
          description: Not found

  /api/books/{id}/next:
    post:
      operationId: nextBookPage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated bookmark after advancing one page (no-op at last page)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bookmark"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /api/books/{id}/prev:
    post:
      operationId: prevBookPage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated bookmark after going back one page (no-op at first page)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bookmark"
        "401":
          description: Unauthorized
        "404":
          description: Not found

components:
  schemas:
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string

    BookSummary:
      type: object
      required: [id, title, author]
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: string

    Book:
      type: object
      required: [id, title, author, summary, totalPages, currentPage, pageContent]
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: string
        summary:
          type: string
        totalPages:
          type: integer
        currentPage:
          type: integer
          description: Reader's bookmark page. The endpoint is auth-required so this is always present.
        pageContent:
          type: string
          description: Text content of the current bookmark page.

    BookPreview:
      type: object
      required: [id, title, author, summary, totalPages, pages]
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: string
        summary:
          type: string
        totalPages:
          type: integer
        pages:
          type: array
          items:
            $ref: "#/components/schemas/Page"

    Page:
      type: object
      required: [number, totalPages, content]
      properties:
        number:
          type: integer
        totalPages:
          type: integer
        content:
          type: string

    Bookmark:
      type: object
      required: [page, totalPages, content, updatedAt]
      properties:
        page:
          type: integer
        totalPages:
          type: integer
        content:
          type: string
        updatedAt:
          type: string
          format: date-time
