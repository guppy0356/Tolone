openapi: 3.1.0
info:
  title: Photo Gallery API
  version: 0.1.0

paths:
  /api/photos:
    get:
      operationId: getPhotos
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: One page of photos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoPage"

components:
  schemas:
    Photo:
      type: object
      required: [id, title, author, url, width, height]
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: string
        url:
          type: string
        width:
          type: integer
          description: Intrinsic image width in pixels
        height:
          type: integer
          description: Intrinsic image height in pixels

    PhotoPage:
      type: object
      required: [items, nextPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
        nextPage:
          type: [integer, "null"]
          description: Next page number, or null when this is the last page
        total:
          type: integer
