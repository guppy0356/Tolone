openapi: 3.1.0
info:
  title: Reading List API
  version: 0.1.0

paths:
  /api/reading-items:
    get:
      operationId: getReadingItems
      summary: List saved reading items (filtered, sorted, paginated)
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by reading status. Omit for all statuses.
          schema:
            $ref: "#/components/schemas/ReadingStatus"
        - name: createdFrom
          in: query
          required: false
          description: Include items registered on or after this date (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: createdTo
          in: query
          required: false
          description: Include items registered on or before this date (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: order
          in: query
          required: false
          description: Sort direction by registration date.
          schema:
            $ref: "#/components/schemas/ReadingOrder"
        - name: page
          in: query
          required: false
          description: 1-based page number.
          schema:
            type: integer
            minimum: 1
        - name: perPage
          in: query
          required: false
          description: Items per page.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: A page of reading items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingItemPage"
    post:
      operationId: createReadingItem
      summary: Register a URL. The server fills in a placeholder title and thumbnail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReadingItemInput"
      responses:
        "201":
          description: The created reading item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingItem"

  /api/reading-items/{id}:
    get:
      operationId: getReadingItem
      summary: Get a single reading item with its note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reading item detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingItem"
        "404":
          description: Reading item not found
    patch:
      operationId: updateReadingItem
      summary: Update the note and/or status of a reading item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReadingItemInput"
      responses:
        "200":
          description: The updated reading item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingItem"
        "404":
          description: Reading item not found
    delete:
      operationId: deleteReadingItem
      summary: Delete a reading item. Items marked "read" cannot be deleted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Reading item not found
        "409":
          description: The item is marked "read" and cannot be deleted

components:
  schemas:
    ReadingStatus:
      type: string
      enum: [unread, reading, read]

    ReadingOrder:
      type: string
      enum: [asc, desc]

    ReadingItemSummary:
      type: object
      description: List-view projection of a reading item (no note).
      required: [id, url, title, thumbnailUrl, status, createdAt]
      properties:
        id:
          type: string
        url:
          type: string
        title:
          type: string
        thumbnailUrl:
          type: string
        status:
          $ref: "#/components/schemas/ReadingStatus"
        createdAt:
          type: string
          format: date-time

    ReadingItem:
      type: object
      description: Full reading item including the note (detail view).
      required: [id, url, title, thumbnailUrl, status, createdAt, note]
      properties:
        id:
          type: string
        url:
          type: string
        title:
          type: string
        thumbnailUrl:
          type: string
        status:
          $ref: "#/components/schemas/ReadingStatus"
        createdAt:
          type: string
          format: date-time
        note:
          type: string

    ReadingItemPage:
      type: object
      required: [items, total, page, perPage]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReadingItemSummary"
        total:
          type: integer
          description: Total number of items matching the filter (across all pages).
        page:
          type: integer
        perPage:
          type: integer

    CreateReadingItemInput:
      type: object
      required: [url]
      properties:
        url:
          type: string

    UpdateReadingItemInput:
      type: object
      description: Partial update; supply note, status, or both.
      properties:
        note:
          type: string
        status:
          $ref: "#/components/schemas/ReadingStatus"
